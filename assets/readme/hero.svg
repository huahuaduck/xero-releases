<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Xi Code 本地优先 AI 工作台</title>
  <desc id="desc">展示 Xi Code 桌面端、Gateway、多模型连接与工具调用之间的本地任务流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d1a"/>
      <stop offset="1" stop-color="#17132e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5d50f6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b7cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect x="42" y="36" width="1116" height="368" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="440" fill="#f7f8fb"/>
  <rect x="42" y="36" width="1116" height="368" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="1080" cy="12" r="190" fill="#665af7" opacity="0.15" filter="url(#soft)"/>
    <circle cx="330" cy="430" r="150" fill="#4385ff" opacity="0.08" filter="url(#soft)"/>
    <path d="M42 335H1158" stroke="#ffffff" stroke-opacity="0.07"/>
    <path d="M42 110H1158" stroke="url(#line)" stroke-opacity="0.35"/>
    <path d="M690 36V404" stroke="#ffffff" stroke-opacity="0.07"/>

    <g id="title-block" transform="translate(92 76)">
      <text x="0" y="0" fill="#a9a2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">WINDOWS / LOCAL-FIRST / AI WORKSPACE</text>
      <text x="0" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Xi Code</text>
      <rect id="title-highlight" x="0" y="95" width="442" height="5" rx="2.5" fill="url(#violet)"/>
      <text x="0" y="142" fill="#eef0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="600">把对话、任务和工具放进同一张工作台</text>
      <text x="0" y="181" fill="#aeb5c9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19">多模型连接 · 本地 Gateway · 可追溯会话 · Windows 桌面端</text>
      <g transform="translate(0 226)">
        <rect width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/>
        <circle cx="21" cy="19" r="6" fill="#73e2ae"/>
        <text x="36" y="25" fill="#f7f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v1.4.3</text>
        <rect x="144" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="164" y="25" fill="#f7f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Windows x64</text>
      </g>
    </g>

    <g id="gateway-card" transform="translate(735 78)">
      <rect width="332" height="88" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="20" y="22" width="44" height="44" rx="13" fill="url(#violet)"/>
      <path d="M31 44c0-8 6-14 14-14 5 0 9 2 12 6-2 1-4 3-5 5-2-2-4-3-7-3-4 0-7 3-7 7s3 7 7 7c3 0 5-1 7-3 1 2 3 4 5 5-3 4-7 6-12 6-8 0-14-6-14-14Z" fill="#fff"/>
      <text x="82" y="36" fill="#f8f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">桌面端</text>
      <text x="82" y="61" fill="#b6bdd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">UI / session / workspace</text>
    </g>

    <g id="model-card" transform="translate(735 190)">
      <rect width="155" height="112" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="28" cy="29" r="7" fill="#8b7cff"/>
      <text x="47" y="35" fill="#f8f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">模型</text>
      <text x="20" y="66" fill="#b6bdd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">OpenAI-compatible</text>
      <text x="20" y="90" fill="#b6bdd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">local / remote</text>
    </g>

    <g id="tool-card" transform="translate(910 190)">
      <rect width="157" height="112" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="28" cy="29" r="7" fill="#73e2ae"/>
      <text x="47" y="35" fill="#f8f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">工具</text>
      <text x="20" y="66" fill="#b6bdd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">files / browser</text>
      <text x="20" y="90" fill="#b6bdd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">MCP / tasks</text>
    </g>

    <path id="flow-line" d="M901 166V188M890 246H910" fill="none" stroke="#8b7cff" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 9"/>
    <circle id="flow-dot" cx="901" cy="177" r="5" fill="#ffffff"/>
    <text x="735" y="350" fill="#9098af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">structured feedback returns to the session</text>
  </g>
</svg>
