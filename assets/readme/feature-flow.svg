<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Xi Code 从输入到可追踪结果的工作流</title>
  <desc id="desc">从主页和新建对话开始，经过模型与工作空间，进入任务、工作流或知识库，最后回到结果和引用。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#181432"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#8e82ff"/><stop offset="1" stop-color="#5c50f4"/></linearGradient></defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="56" y="52" fill="#a9a2ff" font-family="ui-monospace, monospace" font-size="16" letter-spacing="2">FROM INPUT TO TRACEABLE OUTCOME</text>
  <g id="node-home" transform="translate(56 102)"><rect width="150" height="92" rx="16" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/><circle cx="28" cy="30" r="7" fill="#8e82ff"/><text x="48" y="37" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">主页 / 对话</text><text x="22" y="70" fill="#b6bdd1" font-family="ui-monospace, monospace" font-size="14">Ask · Plan · Agent</text></g>
  <g id="node-context" transform="translate(278 102)"><rect width="150" height="92" rx="16" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/><circle cx="28" cy="30" r="7" fill="#73e2ae"/><text x="48" y="37" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">上下文</text><text x="22" y="70" fill="#b6bdd1" font-family="ui-monospace, monospace" font-size="14">模型 · 工作空间</text></g>
  <g id="node-run" transform="translate(500 102)"><rect width="150" height="92" rx="16" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/><circle cx="28" cy="30" r="7" fill="#f6b34b"/><text x="48" y="37" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">执行</text><text x="22" y="70" fill="#b6bdd1" font-family="ui-monospace, monospace" font-size="14">任务 · 工作流 · Agent</text></g>
  <g id="node-knowledge" transform="translate(722 102)"><rect width="150" height="92" rx="16" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/><circle cx="28" cy="30" r="7" fill="#70a7ff"/><text x="48" y="37" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">资料层</text><text x="22" y="70" fill="#b6bdd1" font-family="ui-monospace, monospace" font-size="14">知识库 · 工具 · MCP</text></g>
  <g id="node-result" transform="translate(944 102)"><rect width="150" height="92" rx="16" fill="url(#accent)"/><circle cx="28" cy="30" r="7" fill="#fff"/><text x="48" y="37" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">结果</text><text x="22" y="70" fill="#eeedff" font-family="ui-monospace, monospace" font-size="14">输出 · 文件 · 引用</text></g>
  <g id="connectors" fill="none" stroke="#8e82ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 10"><path d="M206 148H278"/><path d="M428 148H500"/><path d="M650 148H722"/><path d="M872 148H944"/></g>
  <g id="flow-dots" fill="#fff"><circle cx="242" cy="148" r="5"/><circle cx="464" cy="148" r="5"/><circle cx="686" cy="148" r="5"/><circle cx="908" cy="148" r="5"/></g>
</svg>
